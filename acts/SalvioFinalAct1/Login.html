<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <section class="sec">
            <section class="for">
                <img src="images/Aseprite.png" alt="img" id="pfp" width="100" height="100" class="profile"><br>
                <h1 id="head1">Future Video Editor</h1><br>
                <p id="para1">BS Information Technology</p><br>
                <input type="text" id="nick" placeholder="Type nickname here!"><br>

                <select aria-placeholder="disabled" id="selectbox">
                    <option value="none" disabled>---------------Select Course---------------</option>
                    <option value="BS Information Technology" >BS Information Technology</option>
                    <option value="BS Computer Science" >BS Computer Science</option>
                    <option value="BS Hospitality Management" >BS Hospitality Management</option>
                    <option value="BS Tourism Management" >BS Tourism Management</option>
                </select><br><br>

                <nav>
                    <button id="single" class="clickbtn">Click</button>
                    <button id="double" class="dbclickbtn">Double Click</button>
                    <button id="hold" class="holdbtn">Press & Hold</button>
                </nav>

                <h2 id="head2">Welcome!</h2>

            </section>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
