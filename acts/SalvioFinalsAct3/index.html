<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        
        <h1 id="title">Welcome, User!</h1>

        <p class="intro">Welcome to my interactive profile!</p><br>
        
        <div class="StudentInformation">
            <div class="studentinfo">
                <h2>Student Information</h2>
            </div>
            
            <div class="studentinfo">
                
                <p style="font-size: small;">Name:</p> 
                <p style="font-size: small; font-weight: bold;">Darryl</p>
            </div>

            <div class="studentinfo">
                <p style="font-size: small;">Course:</p> 
                <p style="font-size: small; font-weight: bold;" class="pcourse">BSIT</p>
            </div>

            <div class="studentinfo">
                <p style="font-size: small;">Year:</p> 
                <p style="font-size: small; font-weight: bold;" class="pcourse">3rd Year</p>
            </div>
        </div>

        <br>

        <nav>
        <button class="navbut" id="changetitle">Change Title</button>
        <button class="navbut" id="hideprof">Hide Profile</button>
        <button class="navbut" id="showprof">Show Profile</button>
        </nav>

        <br>

        <div class="activites">

            <p class="act">Do something!</p>

        </div>

        <br>

        <table border="1" id="table" width="100%">
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year Level</th>
            </tr>
            
            <tr>
                <td>1</td>
                <td>Juan</td>
                <td>BSIT</td>
                <td>3rd Year</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Maria</td>
                <td>BSCS</td>
                <td>3rd Year</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Pedro</td>
                <td>BSIS</td>
                <td>2nd Year</td>
            </tr>

            <tr>
                <td>4</td>
                <td>Ana</td>
                <td>BSIT</td>
                <td>3rd Year</td>
            </tr>

        </table>

    </div>

   <script src="script.js"></script>
</body>
</html>
